<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>少看点 | AI 情报面板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="少看点 RSS" href="./feed.xml">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    :root {
      --bg:         #060809;
      --bg-side:    rgba(9, 13, 16, 0.82);
      --panel:      rgba(14, 20, 26, 0.92);
      --panel-soft: rgba(17, 25, 32, 0.88);
      --bg-hover:   rgba(95, 227, 255, 0.08);
      --bg-active:  rgba(95, 227, 255, 0.12);
      --border:     rgba(140, 160, 178, 0.16);
      --border-strong: rgba(95, 227, 255, 0.32);
      --text:       #E8EEF3;
      --muted:      #99A7B5;
      --dim:        #61707D;
      --accent:     #5FE3FF;
      --accent-2:   #F2CA72;
      --accent-3:   #8AF5C0;
      --accent-bg:  rgba(95, 227, 255, 0.12);
      --code-bg:    #0B1218;
      --link:       #7CE9FF;
      --shadow:     0 24px 80px rgba(0, 0, 0, 0.32);
    }
    [data-theme="light"] {
      --bg:         #F4F7F9;
      --bg-side:    rgba(248, 250, 252, 0.86);
      --panel:      rgba(255, 255, 255, 0.92);
      --panel-soft: rgba(247, 250, 252, 0.92);
      --bg-hover:   rgba(14, 176, 211, 0.08);
      --bg-active:  rgba(14, 176, 211, 0.12);
      --border:     rgba(74, 88, 104, 0.14);
      --border-strong: rgba(14, 176, 211, 0.28);
      --text:       #15202B;
      --muted:      #4F5F6F;
      --dim:        #7A8998;
      --accent:     #0EA5C7;
      --accent-2:   #C98816;
      --accent-3:   #0F9F6E;
      --accent-bg:  rgba(14, 176, 211, 0.10);
      --code-bg:    #EEF3F7;
      --link:       #00759E;
      --shadow:     0 18px 44px rgba(16, 24, 40, 0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background:
        radial-gradient(circle at top right, rgba(95, 227, 255, 0.16), transparent 24%),
        radial-gradient(circle at 18% 12%, rgba(242, 202, 114, 0.08), transparent 18%),
        linear-gradient(180deg, #040607 0%, #0A0E11 100%);
      color: var(--text);
      line-height: 1.5;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 88%);
      opacity: 0.16;
    }
    [data-theme="light"] body {
      background:
        radial-gradient(circle at top right, rgba(14, 176, 211, 0.12), transparent 22%),
        radial-gradient(circle at 18% 12%, rgba(201, 136, 22, 0.08), transparent 18%),
        linear-gradient(180deg, #F4F7F9 0%, #EDF2F6 100%);
    }
    [data-theme="light"] body::before {
      background-image:
        linear-gradient(rgba(21, 32, 43, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 32, 43, 0.04) 1px, transparent 1px);
      opacity: 0.3;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Header ── */
    #hdr {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      padding: 18px 24px 16px;
      background: var(--bg-side);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border-strong);
      background:
        linear-gradient(135deg, rgba(95, 227, 255, 0.22), rgba(242, 202, 114, 0.10)),
        rgba(255, 255, 255, 0.02);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
    }
    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .brand-overline {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.24em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0;
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hdr-center {
      display: flex;
      justify-content: center;
      min-width: 0;
    }
    .signal-strip {
      min-width: 0;
      width: 100%;
      max-width: 420px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }
    .signal-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .signal-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--dim);
      text-transform: uppercase;
    }
    #headerStatusValue {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hdr-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }
    .signal {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 12px var(--accent);
      animation: blink 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .hdr-btn {
      height: 38px;
      padding: 0 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.15s;
    }
    .hdr-btn:hover {
      border-color: var(--border-strong);
      color: var(--accent);
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }
    .hdr-btn.icon-only {
      width: 38px;
      justify-content: center;
      padding: 0;
    }
    .hdr-btn svg { display: block; }

    /* ── Body ── */
    #body {
      display: grid;
      grid-template-columns: 344px minmax(0, 1fr);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      background: var(--bg-side);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px 18px 24px 20px;
    }
    #sidebar::-webkit-scrollbar { width: 5px; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
    .side-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .rail-head {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .stat-card {
      min-height: 82px;
      padding: 12px 12px 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 55%),
        var(--panel);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }
    .stat-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .stat-value {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }
    .stat-note {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
      word-break: break-word;
    }
    .search-wrap { padding: 0; margin-bottom: 18px; }
    #searchInput {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    #searchInput:focus {
      outline: none; border-color: var(--border-strong);
      box-shadow: 0 0 0 2px var(--accent-bg);
    }
    #searchStatus {
      min-height: 16px;
      margin-top: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--dim);
    }
    .nav-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .nav-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--dim);
    }
    /* ── Month group ── */
    .month-group {
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .month-group:first-child {
      border-top: 0;
      padding-top: 0;
    }
    .month-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: color 0.15s, background 0.15s;
      user-select: none;
      border-radius: 12px;
    }
    .month-hdr:hover { color: var(--text); background: rgba(255, 255, 255, 0.03); }
    .month-hdr.lit { color: var(--accent); }
    .month-count {
      font-size: 10px;
      letter-spacing: 0.08em;
    }
    .month-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding-left: 4px;
    }
    .month-group.open .month-body { max-height: 9999px; }
    .month-group.open > .month-hdr .arr { transform: rotate(90deg); }

    .date-group {
      margin: 8px 0;
    }
    .date-hdr {
      width: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      cursor: pointer;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 80%),
        rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      border-radius: 16px;
      color: var(--muted);
      transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.15s;
      user-select: none;
      text-align: left;
      font: inherit;
    }
    .date-hdr:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      transform: translateX(2px);
    }
    .date-hdr.active {
      color: var(--text);
      border-color: var(--border-strong);
      background:
        linear-gradient(135deg, rgba(95, 227, 255, 0.14), rgba(255, 255, 255, 0.02)),
        rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    .date-hdr.lit { color: var(--accent); }
    .date-hdr.search-hit {
      border-color: rgba(242, 202, 114, 0.36);
      box-shadow: inset 0 0 0 1px rgba(242, 202, 114, 0.08);
    }
    .arr {
      font-size: 12px;
      transition: transform 0.2s;
      display: inline-block;
      color: var(--dim);
    }
    .date-day {
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      min-width: 34px;
    }
    .date-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .date-full {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .date-name {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .date-hdr.active .date-name,
    .date-hdr.active .arr { color: var(--accent); }

    /* ── Content ── */
    #cwrap { overflow-y: auto; }
    #cwrap::-webkit-scrollbar { width: 5px; }
    #cwrap::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }
    #content {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 32px 72px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 320px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .msg-icon { font-size: 40px; opacity: 0.45; }

    @keyframes fadein { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
    .fade { animation: fadein 0.3s ease; }
    .report-shell {
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 28%),
        var(--panel);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .report-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }
    .report-head-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .report-kicker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.20em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .report-context {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .report-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .report-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }
    .report-switcher {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .report-switch-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .report-switch-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .report-switch-chip {
      min-height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .report-switch-chip:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }
    .report-switch-chip.active {
      color: var(--accent);
      border-color: var(--border-strong);
      background: rgba(95, 227, 255, 0.12);
    }
    .report-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .report-tag {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }
    .report-tag.live {
      border-color: var(--border-strong);
      color: var(--accent);
      background: rgba(95, 227, 255, 0.10);
    }
    .report-body {
      padding: 24px 28px 30px;
    }

    /* ── Markdown ── */
    .md {
      font-family: 'Source Serif 4', Georgia, 'PingFang SC', 'Microsoft YaHei', serif;
      font-size: 18px;
      line-height: 1.9;
      color: var(--text);
    }
    .md h1 {
      font-size: 34px;
      font-weight: 600;
      margin-bottom: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .md h2 {
      font-size: 21px;
      font-weight: 600;
      margin: 36px 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .md h3 { font-size: 18px; font-weight: 600; margin: 24px 0 10px; }
    .md h4 {
      font-size: 13px;
      font-weight: 700;
      margin: 18px 0 8px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .md p { margin-bottom: 14px; }
    .md a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-color: rgba(124, 233, 255, 0.32);
      text-underline-offset: 3px;
    }
    .md a:hover { text-decoration-color: var(--link); }
    .md strong { font-weight: 600; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
    .md ul, .md ol { padding-left: 22px; margin-bottom: 12px; }
    .md li { margin-bottom: 6px; }
    .md li > ul, .md li > ol { margin-top: 4px; margin-bottom: 0; }
    .md blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 16px;
      margin: 16px 0;
      color: var(--muted);
      font-style: italic;
      background: rgba(255, 255, 255, 0.02);
    }
    .md code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .md pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      overflow-x: auto;
      margin: 16px 0;
    }
    .md pre code { background: none; border: none; padding: 0; font-size: 12px; }
    .md table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
    }
    .md th {
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .md td { border: 1px solid var(--border); padding: 7px 12px; vertical-align: top; }
    .md tr:nth-child(even) td { background: var(--bg-hover); }
    .md details { border: 1px solid var(--border); border-radius: 14px; margin: 12px 0; overflow: hidden; }
    .md summary {
      cursor: pointer;
      padding: 10px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      background: var(--code-bg);
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.15s;
    }
    .md summary::-webkit-details-marker { display: none; }
    .md summary::before { content: '▶'; font-size: 8px; flex-shrink: 0; }
    .md details[open] summary::before { content: '▼'; }
    .md summary:hover { color: var(--text); }
    .md details > *:not(summary) { padding: 12px 14px; }

    /* ── Mobile ── */
    #mob-toggle { display: none; }
    @media (max-width: 980px) {
      #hdr {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        padding: 16px 16px 14px;
      }
      .hdr-center {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }
      #body {
        grid-template-columns: 1fr;
      }
      #sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      #content {
        padding: 20px 20px 56px;
      }
    }
    @media (max-width: 680px) {
      #hdr { padding: 14px 12px 12px; }
      .brand-title { font-size: 19px; }
      .brand-subtitle { font-size: 11px; }
      .signal-strip { height: 42px; }
      .hdr-right { gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .hdr-btn { padding: 0 10px; }
      .hdr-icon { display: none; }
      #rssLink { display: none; }
      body { overflow: auto; }
      #app { height: auto; min-height: 100vh; }
      #body { overflow: visible; }
      #cwrap { overflow: visible; }
      #sidebar {
        max-height: 56px;
        overflow: hidden;
        padding: 0;
        transition: max-height 0.3s ease;
      }
      #sidebar.open { max-height: 72vh; overflow-y: auto; padding: 0 12px 16px; }
      #mob-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 56px;
        padding: 0 16px;
        cursor: pointer;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        color: var(--muted);
        border-bottom: 1px solid transparent;
        transition: color 0.15s;
      }
      #mob-toggle:hover { color: var(--text); }
      #sidebar.open #mob-toggle { border-bottom-color: var(--border); }
      .rail-head { margin-top: 14px; }
      .stats-grid { grid-template-columns: 1fr; }
      .nav-section { margin-top: 8px; }
      #content { padding: 18px 14px 44px; }
      .report-head,
      .report-body { padding-left: 18px; padding-right: 18px; }
      .report-head {
        flex-direction: column;
        align-items: flex-start;
      }
      .report-tags { justify-content: flex-start; }
      .md { font-size: 16px; }
      .md h1 { font-size: 28px; }
      .md h2 { font-size: 20px; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div class="brand-copy">
        <span class="brand-overline">See Less. Learn More.</span>
        <span class="brand-title">少看点</span>
        <span class="brand-subtitle">把高信号 AI 进展压成一页可读的日常情报面板</span>
      </div>
    </div>
    <div class="hdr-center">
      <div class="signal-strip">
        <div class="signal"></div>
        <div class="signal-copy">
          <span class="signal-label">Current Signal</span>
          <span id="headerStatusValue">等待载入</span>
        </div>
      </div>
    </div>
    <div class="hdr-right">
      <a class="hdr-btn icon-only" href="https://github.com/ceion6/seeless-learnmore" target="_blank" rel="noopener noreferrer" title="项目仓库" aria-label="GitHub">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <a id="rssLink" class="hdr-btn" href="./feed.xml" title="RSS Feed"><span class="hdr-icon">⊕</span>RSS</a>
      <button id="themeBtn" class="hdr-btn"><span class="hdr-icon">◐</span><span class="hdr-label">LIGHT</span></button>
    </div>
  </div>

  <div id="body">
    <div id="sidebar">
      <div id="mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
        ☰ &nbsp;导航与筛选
      </div>
      <div class="rail-head">
        <div class="side-label">Signal Archive</div>
        <div id="stats" class="stats-grid"></div>
      </div>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索关键词，例如 模型 / agent / 论文">
        <div id="searchStatus"></div>
      </div>
      <div class="nav-section">
        <div class="side-label">Timeline</div>
        <div id="timelineMeta" class="nav-meta"></div>
      </div>
      <div id="nav"></div>
    </div>

    <div id="cwrap">
      <div id="content">
        <div class="msg"><div class="msg-icon">AI</div><div>正在加载…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
marked.use({ breaks: true, gfm: true });

// Allow <details> and <summary> which DOMPurify strips by default
DOMPurify.addHook('uponSanitizeElement', (node, data) => {
  if (data.tagName === 'details' || data.tagName === 'summary') {
    data.allowedTags[data.tagName] = true;
  }
});

function renderMarkdown(raw) {
  const html = marked.parse(raw);
  return DOMPurify.sanitize(html, {
    ADD_TAGS: ['details', 'summary'],
    ADD_ATTR: ['open'],
  });
}

const LABELS = {
  'ai-radar':        '少看点 AI 雷达',
  'ai-opportunity':  'AI 机会雷达',
  'ai-cli':          'AI CLI 工具',
  'ai-cli-en':       'AI CLI Tools',
  'ai-agents':       'AI Agents 生态',
  'ai-agents-en':    'AI Agents Ecosystem',
  'ai-web':          '一手官方动态',
  'ai-web-en':       'Official Product Updates',
  'ai-trending':     'GitHub AI 趋势',
  'ai-trending-en':  'GitHub AI Trends',
  'ai-hn':           'HN 社区动态',
  'ai-hn-en':        'HN Community Digest',
  'ai-ph':           'Product Hunt AI',
  'ai-ph-en':        'Product Hunt AI',
  'ai-arxiv':        'ArXiv AI 研究',
  'ai-arxiv-en':     'ArXiv AI Research',
  'ai-hf':           'HF 热门模型',
  'ai-hf-en':        'HF Trending Models',
  'ai-community':    '技术社区 AI',
  'ai-community-en': 'Tech Community AI',
};
const FOCUS_REPORTS = ['ai-radar', 'ai-opportunity'];
const PRIMARY_REPORT = FOCUS_REPORTS[0];
const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const headerStatusValue = document.getElementById('headerStatusValue');
const statsEl = document.getElementById('stats');
const timelineMeta = document.getElementById('timelineMeta');

// ── Theme ──
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('ar-theme') || 'dark';

const themeIcon = themeBtn.querySelector('.hdr-icon');
const themeLabel = themeBtn.querySelector('.hdr-label');

function applyTheme(t) {
  theme = t;
  htmlEl.dataset.theme = t;
  themeIcon.textContent = t === 'dark' ? '◐' : '●';
  themeLabel.textContent = t === 'dark' ? 'LIGHT' : 'DARK';
  localStorage.setItem('ar-theme', t);
}
applyTheme(theme);
themeBtn.onclick = () => applyTheme(theme === 'dark' ? 'light' : 'dark');

// ── Routing ──
function getHash() {
  const [date, report] = location.hash.slice(1).split('/');
  return /^\d{4}-\d{2}-\d{2}$/.test(date) && report ? { date, report } : null;
}

// ── State ──
let currentKey = null;
let searchIndex = null;
let searchReady = false;
let searchQuery = '';
let searchDebounce = null;
let manifestDatesByDate = new Map();

const searchInput = document.getElementById('searchInput');
const searchStatus = document.getElementById('searchStatus');

function setSearchStatus(text) {
  searchStatus.textContent = text || '';
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[char]));
}

function formatLongDate(date) {
  const [year, month, day] = date.split('-');
  return `${year}.${month}.${day}`;
}

function getWeekday(date) {
  return WEEKDAYS[new Date(`${date}T00:00:00`).getDay()];
}

function getReportLocale(report) {
  return report.endsWith('-en') ? 'EN' : 'ZH';
}

function getReportMode(report) {
  return FOCUS_REPORTS.includes(report) ? 'Focus' : 'Source';
}

function getFocusReports(reports) {
  return FOCUS_REPORTS.filter((report) => reports.includes(report));
}

function buildReportSwitcher(date, reports, currentReport) {
  const focusReports = getFocusReports(reports);
  if (focusReports.length < 2) return '';

  const chips = focusReports
    .map((reportId) => {
      const label = escapeHtml(LABELS[reportId] || reportId);
      const active = reportId === currentReport ? ' active' : '';
      return `<a class="report-switch-chip${active}" href="#${date}/${reportId}">${label}</a>`;
    })
    .join('');

  return `
    <div class="report-switcher">
      <span class="report-switch-label">同日视角</span>
      <div class="report-switch-chips">${chips}</div>
    </div>
  `;
}

function updateHeaderStatus(date, report) {
  const label = LABELS[report] || report;
  headerStatusValue.textContent = `${formatLongDate(date)} / ${label}`;
}

function applyDateSearch(query) {
  const needle = query.trim().toLowerCase();
  let hits = 0;

  document.querySelectorAll('.date-group').forEach((grp) => {
    const hdr = grp.querySelector('.date-hdr');
    if (!hdr) return;

    if (!needle || !searchIndex) {
      hdr.classList.remove('search-hit');
      return;
    }

    const text = searchIndex.get(grp.dataset.date) || '';
    const matched = text.includes(needle);
    hdr.classList.toggle('search-hit', matched);
    if (matched) hits += 1;
  });

  if (!needle) {
    setSearchStatus('');
  } else if (!searchReady) {
    setSearchStatus('正在建立索引…');
  } else {
    setSearchStatus(`匹配 ${hits} 天`);
  }
}

async function buildSearchIndex(dates) {
  const index = new Map();
  await Promise.all(
    dates.map(async ({ date, reports }) => {
      const chunks = await Promise.all(
        reports.map(async (report) => {
          try {
            const res = await fetch(`./digests/${date}/${report}.md`);
            if (!res.ok) return '';
            return await res.text();
          } catch {
            return '';
          }
        })
      );
      index.set(date, chunks.join('\n').toLowerCase());
    })
  );
  return index;
}

function initSearch(dates) {
  searchReady = false;
  setSearchStatus('索引准备中…');

  buildSearchIndex(dates).then((index) => {
    searchIndex = index;
    searchReady = true;
    applyDateSearch(searchQuery);
    if (!searchQuery.trim()) setSearchStatus('');
  });
}

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => applyDateSearch(searchQuery), 120);
});

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

async function loadReport(date, report, push = true) {
  const key = `${date}/${report}`;
  if (key === currentKey) return;
  currentKey = key;

  if (push) history.pushState(null, '', `#${key}`);

  // Sync sidebar
  document.querySelectorAll('.date-hdr').forEach(h => h.classList.toggle('active', h.dataset.date === date));
  document.querySelectorAll('.date-hdr').forEach(h => {
    h.classList.toggle('lit', h.dataset.date === date);
  });
  document.querySelectorAll('.month-hdr').forEach(h => {
    const mGrp = h.closest('.month-group');
    const hasDate = !!mGrp.querySelector(`.date-group[data-date="${date}"]`);
    h.classList.toggle('lit', hasDate);
  });
  document.querySelectorAll('.date-group').forEach(g => {
    if (g.dataset.date === date) {
      // Also open parent month group
      const monthGrp = g.closest('.month-group');
      if (monthGrp) monthGrp.classList.add('open');
    }
  });

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');

  const cwrap = document.getElementById('cwrap');
  setContent('<div class="msg"><div class="msg-icon">⏳</div><div>正在加载…</div></div>');
  cwrap.scrollTop = 0;

  try {
    const res = await fetch(`./digests/${date}/${report}.md`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.text();
    const safe = renderMarkdown(raw);
    const reports = manifestDatesByDate.get(date)?.reports || [report];
    const label = escapeHtml(LABELS[report] || report);
    const longDate = escapeHtml(formatLongDate(date));
    const weekday = escapeHtml(getWeekday(date));
    const locale = escapeHtml(getReportLocale(report));
    const mode = escapeHtml(getReportMode(report));
    const reportSwitcher = buildReportSwitcher(date, reports, report);
    updateHeaderStatus(date, report);
    setContent(`
      <section class="report-shell fade">
        <div class="report-head">
          <div class="report-head-main">
            <div class="report-kicker">Active dossier</div>
            <div class="report-context">
              <span class="report-name">${label}</span>
              <span class="report-date">${longDate} · ${weekday}</span>
            </div>
            ${reportSwitcher}
          </div>
          <div class="report-tags">
            <span class="report-tag live">Live</span>
            <span class="report-tag">${mode}</span>
            <span class="report-tag">${locale}</span>
          </div>
        </div>
        <div class="report-body">
          <div class="md">${safe}</div>
        </div>
      </section>
    `);
  } catch (e) {
    setContent(`<div class="msg"><div class="msg-icon">⚠️</div><div>加载失败：${e.message}</div></div>`);
  }
}

function buildDateGroup(date, report) {
  const grp = document.createElement('div');
  grp.className = 'date-group';
  grp.dataset.date = date;

  const hdr = document.createElement('button');
  hdr.className = 'date-hdr';
  hdr.type = 'button';
  hdr.dataset.date = date;

  const daySpan = document.createElement('span');
  daySpan.className = 'date-day';
  daySpan.textContent = date.slice(8);

  const meta = document.createElement('span');
  meta.className = 'date-meta';

  const full = document.createElement('span');
  full.className = 'date-full';
  full.textContent = formatLongDate(date);

  const name = document.createElement('span');
  name.className = 'date-name';
  name.textContent = `${getWeekday(date)} · ${LABELS[report] || report}`;

  const arrSpan = document.createElement('span');
  arrSpan.className = 'arr';
  arrSpan.textContent = '↗';

  meta.append(full, name);
  hdr.appendChild(daySpan);
  hdr.appendChild(meta);
  hdr.appendChild(arrSpan);
  hdr.onclick = () => loadReport(date, report);

  grp.append(hdr);
  return grp;
}

function getPrimaryDates(dates) {
  const primaryDates = dates
    .filter(({ reports }) => reports.includes(PRIMARY_REPORT))
    .map(({ date }) => ({ date, reports: [PRIMARY_REPORT] }));

  if (primaryDates.length) return primaryDates;

  return dates.map(({ date, reports }) => ({ date, reports: reports.slice(0, 1) }));
}

function buildNav(dates) {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';

  // Group dates by month (YYYY-MM)
  const months = new Map();
  dates.forEach((entry) => {
    const month = entry.date.slice(0, 7); // "2026-04"
    if (!months.has(month)) months.set(month, []);
    months.get(month).push(entry);
  });

  let isFirstDate = true;
  let isFirstMonth = true;
  months.forEach((entries, month) => {
    const mGrp = document.createElement('div');
    mGrp.className = 'month-group' + (isFirstMonth ? ' open' : '');

    const mHdr = document.createElement('div');
    mHdr.className = 'month-hdr';
    const mText = document.createTextNode(month + '\u00a0');
    const mArr = document.createElement('span');
    mArr.className = 'arr';
    mArr.textContent = '▶';
    const mCount = document.createElement('span');
    mCount.className = 'month-count';
    mCount.textContent = `${entries.length}d`;
    mHdr.appendChild(mText);
    mHdr.appendChild(mCount);
    mHdr.appendChild(mArr);
    mHdr.onclick = () => mGrp.classList.toggle('open');

    const mBody = document.createElement('div');
    mBody.className = 'month-body';

    entries.forEach(({ date, reports }) => {
      const report = reports.includes(PRIMARY_REPORT) ? PRIMARY_REPORT : reports[0];
      mBody.appendChild(buildDateGroup(date, report, isFirstDate));
      isFirstDate = false;
    });

    mGrp.append(mHdr, mBody);
    nav.appendChild(mGrp);
    isFirstMonth = false;
  });
}

function buildStats(dates) {
  const uniqueReports = new Set(
    dates.flatMap(({ reports }) => reports.map((report) => report.replace(/-en$/, '')))
  ).size;
  const latest = dates[0]?.date ? formatLongDate(dates[0].date) : '--';

  statsEl.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Latest</div>
      <div class="stat-value">${escapeHtml(dates[0]?.date?.slice(5).replace('-', '.') || '--')}</div>
      <div class="stat-note">${escapeHtml(latest)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Days</div>
      <div class="stat-value">${dates.length}</div>
      <div class="stat-note">可回看日报</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Feeds</div>
      <div class="stat-value">${uniqueReports}</div>
      <div class="stat-note">底层信号源</div>
    </div>
  `;
  timelineMeta.textContent = `${dates.length} days`;
}

window.addEventListener('popstate', () => {
  const h = getHash();
  if (h) loadReport(h.date, h.report, false);
});

window.addEventListener('hashchange', () => {
  const h = getHash();
  if (h) loadReport(h.date, h.report, false);
});

// ── Init ──
(async () => {
  try {
    const res = await fetch('./manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    const { dates } = await res.json();
    if (!dates?.length) throw new Error('manifest is empty');
    manifestDatesByDate = new Map(dates.map((entry) => [entry.date, entry]));

    buildStats(dates);
    const navDates = getPrimaryDates(dates);
    buildNav(navDates);
    initSearch(navDates);

    const hash = getHash();
    const first = navDates[0];
    if (hash && dates.find(d => d.date === hash.date && d.reports.includes(hash.report))) {
      loadReport(hash.date, hash.report, false);
    } else if (first?.reports?.length) {
      const r0 = first.reports.includes(PRIMARY_REPORT) ? PRIMARY_REPORT : first.reports[0];
      history.replaceState(null, '', `#${first.date}/${r0}`);
      loadReport(first.date, r0, false);
    }
  } catch (e) {
    document.getElementById('nav').innerHTML =
      '<div class="msg" style="height:80px;font-size:10px">⚠️ ' + e.message + '</div>';
    setContent('<div class="msg"><div class="msg-icon">AI</div><div>无法加载 manifest.json</div></div>');
  }
})();
</script>
</body>
</html>
