name: Daily Seeless Learnmore

on:
  schedule:
    # 每天 00:00 UTC = 08:00 CST (UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-seeless-learnmore
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect daily raw snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: pnpm collect:daily

      - name: Render daily fallback pages
        run: pnpm render:daily

      - name: Update web manifest
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm manifest

      - name: Commit daily artifacts
        id: commit_artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ manifest.json feed.xml
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "digest: ${DATE} publish daily fallback"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        if: steps.commit_artifacts.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm notify

      - name: Send Feishu notification
        if: steps.commit_artifacts.outputs.changed == 'true'
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm notify:feishu

      - name: Send Telegram failure notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram failure notification skipped"
            exit 0
          fi

          payload=$(cat <<EOF
          {
            "chat_id": "$TELEGRAM_CHAT_ID",
            "text": "⚠️ 少看点日报失败\n仓库: ${{ github.repository }}\n工作流: ${{ github.workflow }}\n运行链接: $RUN_URL",
            "disable_web_page_preview": true
          }
          EOF
          )

          curl -fsSL -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Send Feishu failure notification
        if: failure()
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          raw_urls="${FEISHU_WEBHOOK_URLS:-$FEISHU_WEBHOOK_URL}"
          if [ -z "$raw_urls" ]; then
            echo "Feishu failure notification skipped"
            exit 0
          fi

          content="⚠️ 少看点日报失败\n仓库: ${{ github.repository }}\n工作流: ${{ github.workflow }}\n运行链接: $RUN_URL"
          payload=$(cat <<EOF
          {
            "msg_type": "text",
            "content": {
              "text": "$content"
            }
          }
          EOF
          )

          IFS=',' read -r -a urls <<< "$raw_urls"
          for url in "${urls[@]}"; do
            trimmed_url=$(echo "$url" | xargs)
            if [ -n "$trimmed_url" ]; then
              curl -fsSL -X POST "$trimmed_url" \
                -H "Content-Type: application/json" \
                -d "$payload"
            fi
          done
